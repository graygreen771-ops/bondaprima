<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA VOGUE | Admin Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        goldDark: '#AA8C2C',
                        darkBg: '#0A0A0A',
                        cardBg: '#121212',
                        borderDark: '#262626'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-darkBg text-neutral-100 font-sans antialiased selection:bg-gold selection:text-black">

    <!-- Admin Header -->
    <header class="border-b border-borderDark bg-cardBg py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="font-serif text-xl tracking-[0.2em] font-bold text-white">
                    AURA <span class="text-gold">VOGUE</span>
                </a>
                <span class="bg-gold/10 text-gold text-[10px] uppercase tracking-widest px-2.5 py-1 border border-gold/30">Admin Dashboard</span>
            </div>
            <a href="index.html" class="text-xs uppercase tracking-widest text-neutral-400 hover:text-gold transition-colors flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Return to Store</span>
            </a>
        </div>
    </header>

    <!-- Main Admin Container -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Overview Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-cardBg border border-borderDark p-6 rounded-sm">
                <span class="text-xs uppercase tracking-widest text-neutral-400">Total Products</span>
                <h3 id="stat-product-count" class="font-serif text-3xl font-bold text-white mt-2">0</h3>
            </div>
            <div class="bg-cardBg border border-borderDark p-6 rounded-sm">
                <span class="text-xs uppercase tracking-widest text-neutral-400">Total Orders Logged</span>
                <h3 id="stat-order-count" class="font-serif text-3xl font-bold text-white mt-2">0</h3>
            </div>
            <div class="bg-cardBg border border-borderDark p-6 rounded-sm">
                <span class="text-xs uppercase tracking-widest text-neutral-400">Base Currency</span>
                <h3 class="font-serif text-3xl font-bold text-gold mt-2">ETB</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Add New Product Form -->
            <div class="bg-cardBg border border-borderDark p-8 rounded-sm h-fit">
                <h3 class="font-serif text-xl font-bold text-white mb-6 pb-4 border-b border-borderDark">Add New Product</h3>
                <form id="add-product-form" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-neutral-300 mb-2">Product Name *</label>
                        <input type="text" id="new-name" required class="w-full bg-darkBg border border-borderDark px-4 py-3 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-widest text-neutral-300 mb-2">Price (ETB) *</label>
                            <input type="number" id="new-price" required min="1" class="w-full bg-darkBg border border-borderDark px-4 py-3 text-sm text-white focus:outline-none focus:border-gold">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-widest text-neutral-300 mb-2">Category *</label>
                            <select id="new-category" required class="w-full bg-darkBg border border-borderDark px-4 py-3 text-sm text-white focus:outline-none focus:border-gold">
                                <option value="Women">Women</option>
                                <option value="Men">Men</option>
                                <option value="Unisex">Unisex</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-neutral-300 mb-2">Image URL *</label>
                        <input type="url" id="new-image" required placeholder="https://images.unsplash.com/..." class="w-full bg-darkBg border border-borderDark px-4 py-3 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-neutral-300 mb-2">Description *</label>
                        <textarea id="new-desc" required rows="3" class="w-full bg-darkBg border border-borderDark px-4 py-3 text-sm text-white focus:outline-none focus:border-gold"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gold text-black font-semibold py-4 uppercase text-xs tracking-[0.25em] hover:bg-goldDark transition-colors mt-4">
                        Publish Product
                    </button>
                </form>
            </div>

            <!-- Live Inventory Management Table -->
            <div class="lg:col-span-2 bg-cardBg border border-borderDark p-8 rounded-sm">
                <h3 class="font-serif text-xl font-bold text-white mb-6 pb-4 border-b border-borderDark">Live Inventory Catalogue</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-borderDark text-[10px] uppercase tracking-widest text-neutral-400">
                                <th class="py-3 px-4">Item</th>
                                <th class="py-3 px-4">Category</th>
                                <th class="py-3 px-4">Price</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-list" class="divide-y divide-borderDark text-sm">
                            <!-- Populated dynamically via app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
