<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Aura Vogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#111111', accent: '#C5A059', light: '#F9F8F6', muted: '#777777' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-brand-dark antialiased">

    <!-- Top Admin Bar -->
    <header class="bg-brand-dark text-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-serif text-xl font-bold tracking-widest text-brand-accent">AURA VOGUE</span>
                <span class="bg-white/10 px-2 py-0.5 rounded text-xs uppercase tracking-wider">Admin Control Panel</span>
            </div>
            <a href="index.html" class="text-sm bg-white/10 hover:bg-white/20 px-4 py-2 rounded-sm transition-colors"><i class="fa-solid fa-store mr-2"></i>View Live Store</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">

        <!-- Quick Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-sm shadow-sm border border-gray-200">
                <p class="text-xs uppercase font-bold text-brand-muted">Total Products</p>
                <h3 id="stat-product-count" class="text-3xl font-bold mt-2">0</h3>
            </div>
            <div class="bg-white p-6 rounded-sm shadow-sm border border-gray-200">
                <p class="text-xs uppercase font-bold text-brand-muted">Total Orders Received</p>
                <h3 id="stat-order-count" class="text-3xl font-bold mt-2">0</h3>
            </div>
            <div class="bg-white p-6 rounded-sm shadow-sm border border-gray-200">
                <p class="text-xs uppercase font-bold text-brand-muted">Store Currency</p>
                <h3 id="stat-currency" class="text-3xl font-bold mt-2 text-brand-accent">ETB</h3>
            </div>
        </div>

        <!-- Add New Product Section -->
        <div class="bg-white p-6 sm:p-8 rounded-sm shadow-sm border border-gray-200">
            <h2 class="font-serif text-2xl font-bold mb-4">Add New Product</h2>
            <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Product Name</label>
                    <input type="text" id="new-name" required class="w-full px-4 py-2 border rounded-sm focus:outline-none focus:border-brand-accent">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Price</label>
                    <input type="number" id="new-price" required class="w-full px-4 py-2 border rounded-sm focus:outline-none focus:border-brand-accent">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Category</label>
                    <select id="new-category" class="w-full px-4 py-2 border rounded-sm focus:outline-none focus:border-brand-accent">
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Unisex">Unisex</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold uppercase mb-1">Image URL (Unsplash or direct image link)</label>
                    <input type="url" id="new-image" required placeholder="https://images.unsplash.com/..." class="w-full px-4 py-2 border rounded-sm focus:outline-none focus:border-brand-accent">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Short Description</label>
                    <input type="text" id="new-desc" required class="w-full px-4 py-2 border rounded-sm focus:outline-none focus:border-brand-accent">
                </div>
                <div class="sm:col-span-full flex justify-end pt-2">
                    <button type="submit" class="bg-brand-accent hover:bg-amber-600 text-white px-6 py-3 font-bold rounded-sm shadow transition-colors"><i class="fa-solid fa-plus mr-2"></i>Publish Product</button>
                </div>
            </form>
        </div>

        <!-- Product Inventory Management -->
        <div class="bg-white p-6 sm:p-8 rounded-sm shadow-sm border border-gray-200">
            <h2 class="font-serif text-2xl font-bold mb-4">Current Inventory</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-xs uppercase font-bold text-brand-muted">
                            <th class="p-3">Image</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Price</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-table" class="divide-y divide-gray-100 text-sm">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("stat-currency").textContent = STORE_CONFIG.currency;
            loadAdminData();

            document.getElementById("add-product-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const products = getStoredProducts();
                
                const newProduct = {
                    id: Date.now(),
                    name: document.getElementById("new-name").value,
                    price: parseFloat(document.getElementById("new-price").value),
                    category: document.getElementById("new-category").value,
                    image: document.getElementById("new-image").value,
                    description: document.getElementById("new-desc").value
                };

                products.push(newProduct);
                saveStoredProducts(products);
                alert("Product successfully added and live on your store!");
                document.getElementById("add-product-form").reset();
                loadAdminData();
            });
        });

        function loadAdminData() {
            const products = getStoredProducts();
            document.getElementById("stat-product-count").textContent = products.length;

            const tbody = document.getElementById("admin-product-table");
            tbody.innerHTML = "";

            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-brand-muted">No products in inventory. Add one above!</td></tr>`;
                return;
            }

            products.forEach(product => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3"><img src="${product.image}" class="w-12 h-14 object-cover rounded-sm"></td>
                    <td class="p-3 font-medium">${product.name}</td>
                    <td class="p-3"><span class="bg-gray-100 px-2 py-1 text-xs rounded">${product.category}</span></td>
                    <td class="p-3 font-bold">${product.price.toLocaleString()} ${STORE_CONFIG.currency}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteProduct(${product.id})" class="text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded text-xs font-semibold"><i class="fa-solid fa-trash mr-1"></i>Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteProduct(id) {
            if(confirm("Are you sure you want to delete this product?")) {
                let products = getStoredProducts();
                products = products.filter(p => p.id !== id);
                saveStoredProducts(products);
                loadAdminData();
            }
        }
    </script>
</body>
</html>
